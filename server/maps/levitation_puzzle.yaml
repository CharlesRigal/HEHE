name: "Salle de la gravite"
size: [1280, 720]
background: 0

# Cristaux legers et lourds a porter jusqu'aux autels avec des courants
# d'element (vent, eau). Un cristal pose sur un autel l'allume.

spawn_points:
  - x: 200
    y: 500
  - x: 1080
    y: 500

objects:
  - id: 1
    type: wall
    name: "Mur nord"
    points:
      - [0, 0]
      - [1280, 0]
      - [1280, 40]
      - [0, 40]

  - id: 2
    type: wall
    name: "Mur sud (sol)"
    points:
      - [0, 680]
      - [1280, 680]
      - [1280, 720]
      - [0, 720]

  - id: 3
    type: wall
    name: "Mur ouest"
    points:
      - [0, 0]
      - [40, 0]
      - [40, 720]
      - [0, 720]

  - id: 4
    type: wall
    name: "Mur est"
    points:
      - [1240, 0]
      - [1280, 0]
      - [1280, 720]
      - [1240, 720]

# Entites interactives
#   - crystal_small / crystal_large : mobiles, masse variable
#   - altar : statique, 'powered' quand un cristal est dans son rayon
interactive:
  - id: crystal_small
    type: crystal
    position: [500, 600]
    radius: 16
    mass: 1.0
    static: false
    state: { lifted: false }

  - id: crystal_large
    type: crystal
    position: [800, 600]
    radius: 22
    mass: 2.5
    static: false
    state: { lifted: false }

  - id: altar_left
    type: altar
    position: [500, 150]
    radius: 28
    static: true
    state: { powered: false }

  - id: altar_right
    type: altar
    position: [800, 150]
    radius: 28
    static: true
    state: { powered: false }
